[project]
name = "agora"
version = "0.1.0"
description = "Autonomiczna społeczność 10 agentów LLM: własne kanały, graf argumentacji, research w sieci. Ty tylko obserwujesz."
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.5.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.27",
    "ddgs>=9.0",
    "trafilatura>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agora*"]
